<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sky Defender</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d1b2a; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }

      #rotate-prompt {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #0d1b2a;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
        padding: 30px;
        font-family: monospace;
      }
      #rotate-prompt .icon { font-size: 60px; animation: rotateHint 1.5s infinite ease-in-out; }
      #rotate-prompt p { font-size: 14px; color: #f5a623; line-height: 2; }
      @keyframes rotateHint { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)} }

      #touch-controls {
        display: none;
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 20px;
        z-index: 100;
        pointer-events: none;
      }

      .dpad {
        display: grid;
        grid-template-columns: 50px 50px 50px;
        grid-template-rows: 50px 50px 50px;
        gap: 4px;
        pointer-events: all;
      }

      .touch-btn {
        width: 50px; height: 50px; border-radius: 12px;
        background: rgba(233,69,96,0.25);
        border: 2px solid #e94560;
        color: #fff; font-size: 20px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none;
        -webkit-tap-highlight-color: transparent;
        pointer-events: all;
      }
      .touch-btn.active { background: rgba(233,69,96,0.6); }
      .touch-btn.empty { background: transparent; border: none; pointer-events: none; }

      #touch-fire {
        width: 70px; height: 70px; border-radius: 50%;
        background: rgba(245,166,35,0.25);
        border: 2px solid #f5a623;
        font-size: 28px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none;
        -webkit-tap-highlight-color: transparent;
        pointer-events: all;
        align-self: center;
        margin-bottom: 15px;
      }
      #touch-fire.active { background: rgba(245,166,35,0.6); }

      @media (max-width: 768px) and (orientation: portrait) {
        #rotate-prompt { display: flex; }
      }
      @media (max-width: 900px) and (orientation: landscape) {
        #touch-controls { display: flex; }
      }
    </style>
  </head>
  <body>

    <div id="rotate-prompt">
      <div class="icon">📱</div>
      <p>ЗАВЪРТИ ТЕЛЕФОНА<br>ХОРИЗОНТАЛНО<br>ЗА ДА ИГРАЕШ!</p>
    </div>

    <div id="touch-controls">
      <div class="dpad">
        <div class="touch-btn empty"></div>
        <div class="touch-btn" id="touch-up">▲</div>
        <div class="touch-btn empty"></div>
        <div class="touch-btn" id="touch-left">◀</div>
        <div class="touch-btn empty"></div>
        <div class="touch-btn" id="touch-right">▶</div>
        <div class="touch-btn empty"></div>
        <div class="touch-btn" id="touch-down">▼</div>
        <div class="touch-btn empty"></div>
      </div>

      <div id="touch-fire">🔥</div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      function setupTouch(id, key) {
        const el = document.getElementById(id);
        if (!el) return;
        const down = new KeyboardEvent('keydown', { code: key, bubbles: true });
        const up = new KeyboardEvent('keyup', { code: key, bubbles: true });
        ['touchstart','mousedown'].forEach(ev => el.addEventListener(ev, e => {
          e.preventDefault(); el.classList.add('active'); window.dispatchEvent(down);
        }, { passive: false }));
        ['touchend','touchcancel','mouseup'].forEach(ev => el.addEventListener(ev, e => {
          e.preventDefault(); el.classList.remove('active'); window.dispatchEvent(up);
        }, { passive: false }));
      }

      setupTouch('touch-up', 'ArrowUp');
      setupTouch('touch-down', 'ArrowDown');
      setupTouch('touch-left', 'ArrowLeft');
      setupTouch('touch-right', 'ArrowRight');
      setupTouch('touch-fire', 'Space');
    </script>
  </body>
</html>
