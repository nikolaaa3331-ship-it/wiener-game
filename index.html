<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sky Defender</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d1b2a; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }

      #rotate-prompt {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #0d1b2a;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
        padding: 30px;
        font-family: monospace;
      }
      #rotate-prompt .icon { font-size: 60px; animation: rotateHint 1.5s infinite ease-in-out; }
      #rotate-prompt p { font-size: 14px; color: #f5a623; line-height: 2; }
      @keyframes rotateHint { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)} }

      #touch-controls {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        pointer-events: none;
      }
      .touch-btn {
        width: 78px; height: 78px; border-radius: 50%;
        background: rgba(245,166,35,0.25);
        border: 2px solid #f5a623;
        color: #fff; font-size: 28px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none;
        -webkit-tap-highlight-color: transparent;
        pointer-events: all;
      }
      .touch-btn.active { background: rgba(245,166,35,0.6); }

      /* Телефон в портрет — покажи rotate prompt */
      @media (max-width: 768px) and (orientation: portrait) {
        #rotate-prompt { display: flex; }
      }

      /* Телефон в landscape — покажи fire бутон */
      @media (max-width: 900px) and (orientation: landscape) {
        #touch-controls { display: block; }
      }
    </style>
  </head>
  <body>

    <div id="rotate-prompt">
      <div class="icon">📱</div>
      <p>ЗАВЪРТИ ТЕЛЕФОНА<br>ХОРИЗОНТАЛНО<br>ЗА ДА ИГРАЕШ!</p>
    </div>

    <div id="touch-controls">
      <div class="touch-btn" id="touch-fire">🔥</div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      function setupTouch(id, key) {
        const el = document.getElementById(id);
        if (!el) return;
        const down = new KeyboardEvent('keydown', { code: key, bubbles: true });
        const up = new KeyboardEvent('keyup', { code: key, bubbles: true });
        ['touchstart','mousedown'].forEach(ev => el.addEventListener(ev, e => {
          e.preventDefault(); el.classList.add('active'); window.dispatchEvent(down);
        }, { passive: false }));
        ['touchend','touchcancel','mouseup'].forEach(ev => el.addEventListener(ev, e => {
          e.preventDefault(); el.classList.remove('active'); window.dispatchEvent(up);
        }, { passive: false }));
      }
      setupTouch('touch-fire', 'Space');

      let lastTouch = null;
      document.addEventListener('touchstart', (e) => {
        if (e.target.closest('#touch-fire')) return;
        lastTouch = e.touches[0];
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('#touch-fire')) return;
        if (!lastTouch) return;
        const touch = e.touches[0];
        const dx = touch.clientX - lastTouch.clientX;
        const dy = touch.clientY - lastTouch.clientY;
        lastTouch = touch;
        window.dispatchEvent(new CustomEvent('touchmove-delta', { detail: { dx, dy } }));
      }, { passive: true });

      document.addEventListener('touchend', () => { lastTouch = null; }, { passive: true });
    </script>
  </body>
</html>
